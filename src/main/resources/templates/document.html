<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document | SecondBrain</title>
  <link rel="stylesheet" href="/css/library.css" th:href="@{/css/library.css}">
</head>
<body>
  <header class="site-header"><a class="brand" href="/">SecondBrain</a></header>
  <main>
    <p><a href="/">Back to library</a></p>
    <h1 th:text="${document.name}">Document</h1>
    <p>Text extraction: <strong th:text="${document.state}">QUEUED</strong></p>
    <p><a class="delete-link" th:href="@{/documents/{id}/delete(id=${document.documentId})}">Delete document</a></p>
    <section class="notice notice-success" role="status" th:if="${retryMessage != null}"><p th:text="${retryMessage}">Processing queued.</p></section>
    <th:block th:if="${progress != null}" th:insert="~{fragments/processing :: status(${progress}, ${document.documentId})}"></th:block>
    <p><a th:href="@{/documents/{id}(id=${document.documentId})}">Refresh status</a></p>
    <section class="notice notice-error" role="alert" th:if="${progress == null and !document.message.isEmpty()}">
      <h2>Processing information</h2><p th:text="${document.message}">Processing failed.</p>
    </section>
    <section th:if="${document.state.name() == 'EXTRACTED'}" aria-labelledby="text-title">
      <h2 id="text-title">Extracted text</h2>
      <p>Text is extracted. Search uses completed indexes when embeddings are enabled.</p>
      <ol class="source-lines">
        <li th:each="line : ${document.lines}" th:id="${'line-' + line.number}">
          <a th:href="${'#line-' + line.number}"
             th:aria-label="${line.pageNumber.isPresent() ? 'Page ' + line.pageNumber.getAsInt() + ', line ' + line.number : 'Line ' + line.number}"
             th:text="${line.pageNumber.isPresent() ? 'Page ' + line.pageNumber.getAsInt() : '#'}">#</a><pre th:text="${line.text}">Text</pre>
        </li>
      </ol>
    </section>
  </main>
</body>
</html>
