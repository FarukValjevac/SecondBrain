<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, active, content, scripts)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">SecondBrain</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
  <script src="/js/forms.js" th:src="@{/js/forms.js}" defer></script>
  <script type="module" src="/js/app.js" th:src="@{/js/app.js}"></script>
  <th:block th:replace="${scripts}"></th:block>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="app">
    <header class="sidebar">
      <a class="brand" href="/" th:href="@{/}"><span class="brand-mark" aria-hidden="true"></span><span>SecondBrain</span></a>
      <!-- app.js reveals this button and turns the links below into a drawer on narrow screens. -->
      <button type="button" class="menu-button" aria-expanded="false" aria-controls="nav-drawer" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span class="visually-hidden">Menu</span>
      </button>
      <nav class="nav" aria-label="Main" th:fragment="links">
        <a class="nav-link" href="/" th:href="@{/}" th:aria-current="${active == 'ask' ? 'page' : null}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z"/></svg><span>Ask</span></a>
        <a class="nav-link" href="/library" th:href="@{/library}" th:aria-current="${active == 'library' ? 'page' : null}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4v16H5zM11 4h4v16h-4zM17 5l3 1-3 14-3-1z"/></svg><span>Library</span></a>
        <a class="nav-link" href="/search" th:href="@{/search}" th:aria-current="${active == 'search' ? 'page' : null}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span>Search</span></a>
        <a class="nav-link" th:if="${nav != null and nav.study}" href="/flashcards" th:href="@{/flashcards}"
           th:aria-current="${active == 'study' ? 'page' : null}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="13" height="10" rx="2"/><path d="M8 19h12V9"/></svg><span>Study</span></a>
      </nav>
      <a class="nav-add" href="/library#upload-title" th:href="@{/library} + '#upload-title'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add document</span></a>
    </header>
    <dialog class="drawer" id="nav-drawer" aria-label="Navigation">
      <div class="drawer-sheet">
        <button type="button" class="drawer-close" autofocus>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          <span class="visually-hidden">Close menu</span>
        </button>
        <div class="drawer-links"></div>
      </div>
    </dialog>
    <div class="content">
      <main th:replace="${content}"></main>
    </div>
  </div>
</body>
</html>
