# Explicit local-only development opt-in. No logs are shipped.
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://127.0.0.1:4318/v1/metrics
secondbrain.telemetry.otlp-endpoint=http://127.0.0.1:4318/v1/traces
# Capture the complete local walkthrough; normal startup remains at 10%.
management.tracing.sampling.probability=1.0
