spring.application.name=secondbrain
spring.main.banner-mode=off
logging.structured.format.console=logstash
# PDF decoder diagnostics may contain embedded document metadata; expose only our safe failures.
logging.level.org.apache.pdfbox=OFF
logging.level.org.apache.fontbox=OFF
server.address=127.0.0.1
server.port=8080
# Let the browser receive rejection feedback after an oversized local upload.
# This bounds discarded bytes; the accepted upload limit remains separate.
server.tomcat.max-swallow-size=16MB
# Keep first-upload flash sessions in cookies, without rewriting the library URL.
server.servlet.session.tracking-modes=cookie

secondbrain.documents.max-upload-size=10MB
secondbrain.documents.storage-directory=./data/documents

# Embedding settings are opt-in. A model/dimension pair must be selected explicitly.
# Constructing the provider makes no request; document embedding delivery is not connected yet.
secondbrain.embeddings.enabled=${SECONDBRAIN_EMBEDDINGS_ENABLED:false}
secondbrain.embeddings.model=${CLOUDFLARE_EMBEDDING_MODEL:}
secondbrain.embeddings.dimensions=${CLOUDFLARE_EMBEDDING_DIMENSIONS:0}

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:secondbrain}
spring.datasource.username=${POSTGRES_USER:secondbrain}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# Management endpoints share the application's loopback HTTP listener.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoints.web.exposure.include=health,metrics
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,eventWorker,originalStorage

# Local observations work without a collector. Only our sanitizing exporter may send traces.
management.tracing.export.otlp.enabled=false
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.tracing.sampling.probability=0.1
management.tracing.baggage.enabled=false
management.tracing.baggage.correlation.enabled=false
management.opentelemetry.tracing.export.max-queue-size=256
management.opentelemetry.tracing.export.max-batch-size=64
management.opentelemetry.tracing.export.schedule-delay=1s
management.opentelemetry.tracing.export.timeout=2s
management.opentelemetry.tracing.limits.max-attributes=24
management.opentelemetry.tracing.limits.max-attribute-value-length=128
management.opentelemetry.tracing.limits.max-events=0
management.opentelemetry.tracing.limits.max-links=1
