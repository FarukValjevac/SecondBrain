spring.application.name=secondbrain
spring.main.banner-mode=off
logging.structured.format.console=logstash
server.address=127.0.0.1
server.port=8080

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:secondbrain}
spring.datasource.username=${POSTGRES_USER:secondbrain}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# Management endpoints share the application's loopback HTTP listener.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoints.web.exposure.include=health,metrics
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
