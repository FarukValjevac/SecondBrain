services:
  observability:
    image: grafana/otel-lgtm:0.39.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=24h --storage.tsdb.retention.size=256MB
    volumes:
      - ./data/observability:/data
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/secondbrain.yaml:ro
      - ./observability/secondbrain.json:/otel-lgtm/secondbrain.json:ro
      - ./observability/tempo.yaml:/otel-lgtm/tempo-config.yaml:ro
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && curl -fsS --max-time 1 http://127.0.0.1:3000/api/health >/dev/null && curl -fsS --max-time 1 http://127.0.0.1:9090/-/ready >/dev/null && curl -fsS --max-time 1 http://127.0.0.1:3200/ready >/dev/null && curl -fsS --max-time 1 http://127.0.0.1:13133/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secondbrain}
      POSTGRES_USER: ${POSTGRES_USER:-secondbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
