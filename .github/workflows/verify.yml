name: Verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and formatting (Java 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Unit tests, formatting and package
        # No Docker needed; integration tests run in the parallel job below.
        run: ./mvnw --batch-mode --no-transfer-progress verify -Dit.test=NONE -Dit.failIfNoSpecifiedTests=false -Dtest.forkCount=2

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          retention-days: 7

  integration:
    name: Integration tests (Java 25, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Install Tesseract for the text recognition check
        # Packages come from the Actions cache after the first run, so a slow mirror rarely matters.
        timeout-minutes: 4
        uses: awalsh128/cache-apt-pkgs-action@009d70260b0f2e115cfa77447f8bd04c8e797064 # v2.0.0
        with:
          packages: tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          version: '1'
          execute_install_scripts: true

      - name: Integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Docr.tesseract=true -Dit.forkCount=3

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports
          path: target/failsafe-reports/
          retention-days: 7
